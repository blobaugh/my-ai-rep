[project]
name = "benbot"
version = "0.1.0"
description = "BenBot — an AI that speaks for Ben"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv",
    "openai",
    "numpy",
    "fastapi>=0.115.14,<0.116",
    "uvicorn>=0.32.1,<0.33",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "boto3",
    "httpx",
]
e2e = [
    "httpx",
    "playwright",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: live Ollama (RUN_INTEGRATION=1) or MinIO backup (RUN_BACKUP_INTEGRATION=1)",
    "e2e: dev Docker stack (RUN_E2E=1; see scripts/e2e.sh)",
    "e2e_llm: e2e test needs reachable LLM from api container",
    "e2e_browser: e2e test needs playwright",
    "e2e_session_limits: needs docker-compose.e2e.yml session settings",
    "e2e_limits: needs docker-compose.e2e.yml concurrency settings",
]

[tool.ruff]
target-version = "py39"
line-length = 88
