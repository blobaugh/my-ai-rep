# Build images from a git checkout on the droplet (linux/amd64). Same edge layout as
# production: no host ports; web + api join external PROXY_NETWORK (default `web`).
# Chat LLM settings come from .env only.
#
# Prerequisite: docker network create web   # or whatever PROXY_NETWORK is
#
#   export BENBOT_HOME="$PWD"
#   docker compose -f docker-compose.yml -f docker-compose.checkout.yml up --build -d
#   docker compose -f docker-compose.yml -f docker-compose.checkout.yml --profile tools run --rm ingest
#
# Or: scripts/checkout-up.sh -d

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: benbot/api:checkout
    platform: linux/amd64
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data
      - ${BENBOT_HOME:-.}/examples:/content:ro

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: benbot/web:checkout
    platform: linux/amd64

  embedder:
    build:
      context: .
      dockerfile: docker/embedder/Dockerfile
    image: benbot/embedder:checkout
    platform: linux/amd64

  ingest:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: benbot/api:checkout
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data
      - ${BENBOT_HOME:-.}/examples:/content:ro

  backup:
    profiles: ["optional"]
