# Local override: build images, publish localhost ports, proxy /api through web.

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: benbot/api:dev
    platform: linux/arm64
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data
      - ${BENBOT_HOME:-.}/examples:/content:ro
    environment:
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      EMBED_BASE_URL: http://embedder:11434/v1
      CONTENT_DIR: /content
      DB_PATH: /app/data/benbot.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: benbot/web:dev
    platform: linux/arm64
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DEV_PROXY_API: "1"
    depends_on:
      api:
        condition: service_healthy

  embedder:
    build:
      context: .
      dockerfile: docker/embedder/Dockerfile
    image: benbot/embedder:dev
    platform: linux/arm64
    environment:
      EMBED_MODEL: nomic-embed-text

  ingest:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: benbot/api:dev
    platform: linux/arm64
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data
      - ${BENBOT_HOME:-.}/examples:/content:ro
    environment:
      CONTENT_DIR: /content
      EMBED_BASE_URL: http://embedder:11434/v1

networks:
  proxy:
    external: false
