# Local override: build images, publish localhost ports, proxy /api through web.

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: benbot/api:dev
    platform: linux/arm64
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data
      - ${BENBOT_HOME:-.}/examples:/content:ro
    environment:
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      EMBED_BASE_URL: http://embedder:11434/v1
      CONTENT_DIR: /content
      DB_PATH: /app/data/benbot.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: benbot/web:dev
    platform: linux/arm64
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DEV_PROXY_API: "1"
    depends_on:
      api:
        condition: service_healthy

  embedder:
    build:
      context: .
      dockerfile: docker/embedder/Dockerfile
    image: benbot/embedder:dev
    platform: linux/arm64
    environment:
      EMBED_MODEL: nomic-embed-text

  ingest:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: benbot/api:dev
    platform: linux/arm64
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data
      - ${BENBOT_HOME:-.}/examples:/content:ro
    environment:
      CONTENT_DIR: /content
      EMBED_BASE_URL: http://embedder:11434/v1

  minio:
    image: quay.io/minio/minio:latest
    platform: linux/arm64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: benbot/backup:dev
    platform: linux/arm64
    env_file: .env
    environment:
      DB_PATH: /app/data/benbot.sqlite
      SPACES_ENDPOINT: http://minio:9000
      SPACES_BUCKET: benbot-backups
      SPACES_KEY: minioadmin
      SPACES_SECRET: minioadmin
      SPACES_PREFIX: dev
      SPACES_REGION: us-east-1
      SPACES_ADDRESSING_STYLE: path
      BACKUP_INTERVAL_MINUTES: 60
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data:ro
    depends_on:
      minio:
        condition: service_started

networks:
  proxy:
    external: false

volumes:
  minio_data:
