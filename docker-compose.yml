name: benbot

# Production: pull images only. Build linux/amd64 images in CI (BENBOT-30).
# docker buildx build --platform linux/amd64 -f docker/api/Dockerfile -t "$BENBOT_IMAGE_PREFIX/api:$BENBOT_TAG" .

services:
  api:
    container_name: benbot_api
    image: ${BENBOT_IMAGE_PREFIX:-benbot}/api:${BENBOT_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CONTENT_DIR: /content
      DB_PATH: /app/data/benbot.sqlite
      EMBED_BASE_URL: http://embedder:11434/v1
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data
      - ${BENBOT_HOME:-.}/content:/content:ro
    networks:
      - web
      - internal
    depends_on:
      embedder:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    container_name: benbot_web
    image: ${BENBOT_IMAGE_PREFIX:-benbot}/web:${BENBOT_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      DEV_PROXY_API: "0"
    networks:
      - web
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingest:
    profiles: ["tools"]
    image: ${BENBOT_IMAGE_PREFIX:-benbot}/api:${BENBOT_TAG:-latest}
    platform: linux/amd64
    env_file: .env
    environment:
      CONTENT_DIR: /content
      EMBED_BASE_URL: http://embedder:11434/v1
      # Staging and publish both on the data volume (read_only + tmpfs /tmp breaks os.replace).
      TMPDIR: /app/data/tmp
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data
      - ${BENBOT_HOME:-.}/content:/content:ro
    networks:
      - internal
    depends_on:
      embedder:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    command: ["python", "-m", "src.ingest"]

  backup:
    container_name: benbot_backup
    image: ${BENBOT_IMAGE_PREFIX:-benbot}/backup:${BENBOT_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/benbot.sqlite
    volumes:
      - ${BENBOT_HOME:-.}/data:/app/data:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  embedder:
    container_name: benbot_embedder
    image: ${BENBOT_IMAGE_PREFIX:-benbot}/embedder:${BENBOT_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      EMBED_MODEL: nomic-embed-text
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
    name: ${PROXY_NETWORK:-web}
  internal:
    internal: true

volumes:
  ollama_models:
