<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <meta name="description" content="Chat with an AI that answers from the site owner's own writing.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page embed">
  <header class="top">
    <h1 id="ai-label" class="ai-label">Loading…</h1>
    <div class="actions">
      <button id="new-chat" type="button">New chat</button>
      <details id="about" class="about">
        <summary>About</summary>
        <div class="about-panel">
          <p>To ask the site owner to remove a conversation, send them this session id. It is kept only until you leave or reload this page.</p>
          <p class="session-row">
            <span class="visually-hidden">Session id</span>
            <code id="session-id">none yet</code>
            <button id="copy-id" type="button">Copy</button>
          </p>
          <p id="contact-row" hidden>
            <a id="contact-link" href="https://example.com/">Contact</a>
          </p>
        </div>
      </details>
    </div>
  </header>
  <main class="chat">
    <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions">
      <details id="logging-notice" class="notice">
        <summary id="logging-notice-summary"></summary>
        <p id="logging-notice-detail" class="notice-detail" hidden></p>
      </details>
    </div>
    <form id="composer" class="composer">
      <label class="visually-hidden" for="message">Message</label>
      <div class="composer-fields">
        <textarea id="message" name="message" rows="1" placeholder="Ask a question…"></textarea>
        <p id="char-count" class="char-count" aria-live="polite"></p>
      </div>
      <button id="send" type="submit">Send</button>
    </form>
    <p id="status" class="status" role="status"></p>
  </main>
  <script type="module" src="chat.js"></script>
</body>
</html>
