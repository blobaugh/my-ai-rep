# BenBot container pipeline (private GitLab). Builds linux/amd64 images only.
# See docs/history/deploy-ci-operator.md for remotes, variables, and runner examples.

stages:
  - lint
  - test
  - scan
  - build
  - verify-images

default:
  interruptible: true

variables:
  BENBOT_BUILD_PLATFORM: linux/amd64
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  # Image repository prefix (e.g. registry.example.com/benbot). Override in CI/CD settings if needed.
  BENBOT_REGISTRY: "${CI_REGISTRY_IMAGE}"

.workflow_rules: &workflow_rules
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:ruff:
  stage: lint
  image: python:3.9-slim-bookworm
  <<: *workflow_rules
  before_script:
    - pip install --no-cache-dir ruff
  script:
    - ./scripts/ci/lint.sh

test:pytest-js:
  stage: test
  image: python:3.9-slim-bookworm
  <<: *workflow_rules
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends nodejs
    - pip install --no-cache-dir -e ".[dev]"
  script:
    - ./scripts/ci/test.sh

scan:public-safe:
  stage: scan
  image: alpine:3.20
  <<: *workflow_rules
  before_script:
    - apk add --no-cache git grep
  script:
    - ./scripts/ci/scan.sh

.build_template: &build_template
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  <<: *workflow_rules
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      export TAG_SHA="${CI_COMMIT_SHORT_SHA}"
      export TAG_LATEST="latest"
      export TAG_VERSION="${CI_COMMIT_TAG:-}"
      export IMAGE_API="${BENBOT_REGISTRY}/api"
      export IMAGE_WEB="${BENBOT_REGISTRY}/web"
      export IMAGE_EMBEDDER="${BENBOT_REGISTRY}/embedder"
      export IMAGE_BACKUP="${BENBOT_REGISTRY}/backup"
      docker buildx create --use --name benbot-ci || docker buildx use benbot-ci
  script:
    - |
      set -eu
      platform="$BENBOT_BUILD_PLATFORM"
      build_push() {
        dockerfile=$1
        repo=$2
        set -- -f "$dockerfile" -t "${repo}:${TAG_SHA}"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          set -- "$@" -t "${repo}:latest"
        fi
        if [ -n "$TAG_VERSION" ]; then
          set -- "$@" -t "${repo}:${TAG_VERSION}"
        fi
        docker buildx build --platform "$platform" \
          "$@" \
          --cache-from "type=registry,ref=${repo}:buildcache" \
          --cache-to "type=registry,ref=${repo}:buildcache,mode=max" \
          --push \
          .
      }
      build_push docker/api/Dockerfile "$IMAGE_API"
      build_push docker/web/Dockerfile "$IMAGE_WEB"
      build_push docker/embedder/Dockerfile "$IMAGE_EMBEDDER"
      build_push docker/backup/Dockerfile "$IMAGE_BACKUP"

build:images:
  <<: *build_template

verify:images:
  stage: verify-images
  image: docker:24-cli
  services:
    - docker:24-dind
  needs: ["build:images"]
  <<: *workflow_rules
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      export IMAGE_API="${BENBOT_REGISTRY}/api:${CI_COMMIT_SHORT_SHA}"
      export IMAGE_WEB="${BENBOT_REGISTRY}/web:${CI_COMMIT_SHORT_SHA}"
      export IMAGE_EMBEDDER="${BENBOT_REGISTRY}/embedder:${CI_COMMIT_SHORT_SHA}"
      export IMAGE_BACKUP="${BENBOT_REGISTRY}/backup:${CI_COMMIT_SHORT_SHA}"
      docker pull "$IMAGE_API"
      docker pull "$IMAGE_WEB"
      docker pull "$IMAGE_EMBEDDER"
      docker pull "$IMAGE_BACKUP"
  script:
    - ./scripts/ci/verify_images.sh
